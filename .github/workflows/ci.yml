name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: x
      EMAIL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      EMAIL_BLIND_INDEX_SECRET: x
      JWT_SECRET: test-jwt-secret-with-at-least-32-chars
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-with-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # CD: so roda em push na main, depois que backend e frontend passaram.
  # Os hooks pedem um build do ultimo commit da main; o Render so troca a versao
  # se o health check (/health) da nova passar.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Check deploy hooks
        run: |
          for name in RENDER_DEPLOY_HOOK VERCEL_DEPLOY_HOOK; do
            [ -n "${!name}" ] || { echo "::error::secret $name is not set"; exit 1; }
          done
      - name: Deploy backend (Render)
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
      - name: Deploy frontend (Vercel)
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
