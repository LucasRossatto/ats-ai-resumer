name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Cada etapa vira uma caixa propria no grafo da execucao. As etapas de um
  # mesmo projeto rodam em paralelo e cada uma reinstala as dependencias
  # (o cache do pnpm deixa isso barato).
  backend:
    name: backend / ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: audit
            run: pnpm audit --prod --audit-level=high
          - task: lint
            run: pnpm lint
          - task: test
            run: pnpm test
          - task: build
            run: pnpm build
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: x
      EMAIL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      EMAIL_BLIND_INDEX_SECRET: x
      JWT_SECRET: test-jwt-secret-with-at-least-32-chars
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-with-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}

  frontend:
    name: frontend / ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: lint
            run: pnpm lint
          - task: typecheck
            run: pnpm typecheck
          - task: test
            run: pnpm test
          - task: build
            run: pnpm build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}

  # CD: so roda em push na main, depois que todas as etapas acima passaram.
  # Cada hook pede um build do ultimo commit da main; o Render so troca a
  # versao se o health check (/health) da nova passar. Os dois deploys sao
  # independentes: se um hook falhar, o outro segue.
  deploy-backend:
    name: deploy / backend (Render)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Check deploy hook
        run: '[ -n "$RENDER_DEPLOY_HOOK" ] || { echo "::error::secret RENDER_DEPLOY_HOOK is not set"; exit 1; }'
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

  deploy-frontend:
    name: deploy / frontend (Vercel)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Check deploy hook
        run: '[ -n "$VERCEL_DEPLOY_HOOK" ] || { echo "::error::secret VERCEL_DEPLOY_HOOK is not set"; exit 1; }'
      - name: Trigger Vercel deploy
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
