name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: x
      EMAIL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      EMAIL_BLIND_INDEX_SECRET: x
      JWT_SECRET: test-jwt-secret-with-at-least-32-chars
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-with-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # O frontend usa npm (package-lock.json), nao pnpm.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # TODO: adicionar passo de typecheck
      # TODO: adicionar passo de test
      - run: npm run build
